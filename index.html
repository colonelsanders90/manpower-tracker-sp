<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAiD HR Tracker</title>

  <!--
    SP JSOM — loaded from SharePoint at runtime, not bundled by Vite.
    Load order is strict — do not reorder or skip.

    MicrosoftAjax.js patches Array/Object prototypes, but this has been
    confirmed safe in this environment because the static tags execute
    synchronously before the React bundle parses (React's own prototype
    state is not yet established). Lazy-loading these AFTER React boots
    would be too late for clientpeoplepicker.js to initialise correctly.

    All 8 scripts are required for searchUsers() (AD people picker).
  -->
  <script src="/_layouts/15/MicrosoftAjax.js"></script>
  <script src="/_layouts/15/sp.runtime.js"></script>
  <script src="/_layouts/15/sp.js"></script>
  <script src="/_layouts/15/init.js"></script>
  <script src="/_layouts/15/clienttemplates.js"></script>
  <script src="/_layouts/15/autofill.js"></script>
  <script src="/_layouts/15/clientforms.js"></script>
  <script src="/_layouts/15/clientpeoplepicker.js"></script>
</head>
<body>
  <!-- Early error display — runs before React, visible without DevTools.
       Shows any crash as plain text on screen instead of a blank page. -->
  <div id="early-error" style="display:none;font-family:monospace;padding:24px;background:#fff;color:#c00;white-space:pre-wrap;font-size:13px;border:2px solid #c00;margin:24px;border-radius:6px"></div>
  <script>
    window.onerror = function(msg, src, line, col, err) {
      var box = document.getElementById('early-error');
      box.style.display = 'block';
      box.textContent = 'ERROR: ' + msg + '\nSource: ' + src + '\nLine: ' + line + ':' + col + (err && err.stack ? '\n\n' + err.stack : '');
    };
    window.addEventListener('unhandledrejection', function(e) {
      var box = document.getElementById('early-error');
      box.style.display = 'block';
      box.textContent = (box.textContent || '') + '\nUNHANDLED PROMISE: ' + (e.reason && e.reason.stack ? e.reason.stack : String(e.reason));
    });
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
