<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAiD HR Tracker</title>

  <!-- ── Early-error box ─────────────────────────────────────────────────── -->
  <style>
    #early-error {
      display: none; font-family: monospace; font-size: 13px;
      padding: 24px; margin: 24px; background: #fff; color: #c00;
      white-space: pre-wrap; border: 2px solid #c00; border-radius: 6px;
    }
  </style>

  <!-- ── SP JSOM (people picker) ─────────────────────────────────────────────
       Synchronous, strict load order — do not reorder or remove any entry.
       All 8 are required for searchUsers() / clientpeoplepicker.js.
       See workspace CLAUDE.md → "Script load" for the full dependency chain. -->
  <script src="/_layouts/15/MicrosoftAjax.js"></script>
  <script src="/_layouts/15/sp.runtime.js"></script>
  <script src="/_layouts/15/sp.js"></script>
  <script src="/_layouts/15/init.js"></script>
  <script src="/_layouts/15/clienttemplates.js"></script>
  <script src="/_layouts/15/autofill.js"></script>
  <script src="/_layouts/15/clientforms.js"></script>
  <script src="/_layouts/15/clientpeoplepicker.js"></script>
</head>
<body>

  <!-- Pre-React crash display — visible without DevTools on the intranet. -->
  <div id="early-error"></div>
  <script>
    (function () {
      function show(msg) {
        var box = document.getElementById('early-error');
        box.style.display = 'block';
        box.textContent = (box.textContent ? box.textContent + '\n' : '') + msg;
      }
      window.onerror = function (msg, src, line, col, err) {
        show('ERROR: ' + msg +
             '\nSource: ' + src + '\nLine: ' + line + ':' + col +
             (err && err.stack ? '\n\n' + err.stack : ''));
      };
      window.addEventListener('unhandledrejection', function (e) {
        show('UNHANDLED PROMISE: ' +
             (e.reason && e.reason.stack ? e.reason.stack : String(e.reason)));
      });
    }());
  </script>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

</body>
</html>
